services:
  ai-router:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-router-backend:1.11.5
    container_name: ai-router-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8731:8731"
    environment:
      TRACEMAKER_URL: ""
      TZ: America/Toronto
    volumes:
      - ../data:/data
    cpus: 3.0
